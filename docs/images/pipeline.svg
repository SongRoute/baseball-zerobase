<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Baseball Zerobase pipeline</title><desc id="desc">Source data to pre-pitch features, transition modeling, candidate scoring and ranked output. Time-aware validation prevents leakage. Ranking uses a transition-risk proxy, not expected inning runs.</desc><rect width="1200" height="460" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="48" y="66" font-size="30" font-weight="700" fill="#f8fafc">BASEBALL ZEROBASE</text><text x="48" y="101" font-size="17" fill="#94a3b8">Data pipeline · Leakage prevention · Pitch recommendation research</text><rect x="48" y="151" width="208" height="140" rx="12" fill="#1e293b" stroke="#334155"/><text x="64" y="184" font-size="18" fill="#38bdf8">01</text><text x="64" y="221" font-size="14" font-weight="700" fill="#f8fafc">SOURCE DATA</text><text x="64" y="254" font-size="12" fill="#cbd5e1">Statcast / game feeds</text><path d="M259 221h10m-4-4 4 4-4 4" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="272" y="151" width="208" height="140" rx="12" fill="#1e293b" stroke="#334155"/><text x="288" y="184" font-size="18" fill="#38bdf8">02</text><text x="288" y="221" font-size="14" font-weight="700" fill="#f8fafc">PRE-PITCH STATE</text><text x="288" y="254" font-size="12" fill="#cbd5e1">Snapshots / as-of features</text><path d="M483 221h10m-4-4 4 4-4 4" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="496" y="151" width="208" height="140" rx="12" fill="#1e293b" stroke="#334155"/><text x="512" y="184" font-size="18" fill="#38bdf8">03</text><text x="512" y="221" font-size="14" font-weight="700" fill="#f8fafc">TRANSITION MODEL</text><text x="512" y="254" font-size="12" fill="#cbd5e1">Legal outcome probabilities</text><path d="M707 221h10m-4-4 4 4-4 4" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="720" y="151" width="208" height="140" rx="12" fill="#1e293b" stroke="#334155"/><text x="736" y="184" font-size="18" fill="#38bdf8">04</text><text x="736" y="221" font-size="14" font-weight="700" fill="#f8fafc">PITCH CANDIDATES</text><text x="736" y="254" font-size="12" fill="#cbd5e1">Pitch type × relative zone</text><path d="M931 221h10m-4-4 4 4-4 4" fill="none" stroke="#38bdf8" stroke-width="2"/><rect x="944" y="151" width="208" height="140" rx="12" fill="#1e293b" stroke="#334155"/><text x="960" y="184" font-size="18" fill="#38bdf8">05</text><text x="960" y="221" font-size="14" font-weight="700" fill="#f8fafc">RANKED OUTPUT</text><text x="960" y="254" font-size="12" fill="#cbd5e1">Transition-risk proxy / CLI</text><rect x="48" y="321" width="1104" height="46" rx="8" fill="#123044"/><text x="70" y="350" font-size="16" fill="#7dd3fc">VALIDATION   •   Prior data only   •   Timestamp checks   •   Rolling evaluation</text><text x="48" y="413" font-size="15" fill="#94a3b8">Current ranking: transition_proxy. Not expected inning runs or validated real-world effectiveness.</text></g></svg>