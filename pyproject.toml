[project]
name = "baseball-zerobase"
version = "0.1.0"
description = "Leakage-safe MLB starting-pitcher strategy research pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.2",
  "pandas>=2.3",
  "polars>=1.30",
  "pyarrow>=19",
  "pybaseball>=2.2.7",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "pyyaml>=6.0",
  "scikit-learn>=1.7",
  "scipy>=1.15",
  "tenacity>=9.1",
  "typer>=0.16",
]

[project.scripts]
baseball-zerobase = "baseball_zerobase.cli:app"

[dependency-groups]
dev = [
  "pyright>=1.1",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/baseball_zerobase"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
